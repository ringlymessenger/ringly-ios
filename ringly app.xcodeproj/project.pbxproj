			shellPath = /bin/sh;
			shellScript = "# Auto build number = git commit count (одинаковый у приложения и расширения).\n# ⚠️ БЕЗ запасного значения. Тихий фолбэк «|| echo 1» уже развёл CFBundleVersion приложения\n# и расширения (37 против 1) — загрузка упала бы с ITMS-90473, причём незаметно на сборке.\n# Лучше сломать сборку здесь, чем узнать об этом от App Store Connect.\nset -euo pipefail\nn=$(git -C \"$SRCROOT\" rev-list --count HEAD)\nplist=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\nif [ ! -f \"$plist\" ]; then\n  echo \"error: не найден $plist — некуда писать CFBundleVersion\" >&2\n  exit 1\nfi\n# Release (TestFlight/App Store) обязан называться «Ringly». Поле Display Name на вкладке General\n# правит имя во ВСЕХ конфигурациях разом — так в TestFlight уже трижды уехало «Ringly Dev».\n# Сверяем НАСТРОЙКУ сборки, а не готовый Info.plist: Xcode не гарантирует, что этот скрипт\n# идёт после ProcessInfoPlistFile, и файл может остаться от прошлой сборки.\nif [ \"$CONFIGURATION\" = \"Release\" ]; then\n  name=\"${INFOPLIST_KEY_CFBundleDisplayName:-}\"\n  if [ \"$name\" != \"Ringly\" ]; then\n    echo \"error: Release-сборка называется «$name», а должна «Ringly» (INFOPLIST_KEY_CFBundleDisplayName в конфигурации Release)\" >&2\n    exit 1\n  fi\nfi\n/usr/libexec/PlistBuddy -c \"Set :CFBundleVersion $n\" \"$plist\"\necho \"note: CFBundleVersion set to $n\"\n";
